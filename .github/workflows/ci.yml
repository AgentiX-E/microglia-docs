name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Unit and contract tests with coverage
        run: pnpm test

      - name: Mechanism study and gates
        run: pnpm bench

      - name: Scale and latency POC (no API keys)
        run: pnpm poc:scale

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: |
            bench/results
            poc/results
            coverage/coverage-summary.json
          if-no-files-found: warn

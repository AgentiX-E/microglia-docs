name: poc-live

on:
  workflow_dispatch:
  push:
    paths:
      - 'poc/**'
      - '.github/workflows/poc-live.yml'

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Live POC (DeepSeek + Zhipu)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          POC_MAX_CALLS: '400'
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ] || [ -z "$ZHIPU_API_KEY" ]; then
            echo "::error::DEEPSEEK_API_KEY and ZHIPU_API_KEY are required for the live POC"
            exit 1
          fi
          pnpm poc:live

      - name: Upload live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-poc
          path: poc/results
          if-no-files-found: warn
